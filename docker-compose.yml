version: '3.9'

services:

  api:
    build: .
    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

    command:
      uvicorn app.api.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:18

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multiagent

    ports:
      - "5433:5432"